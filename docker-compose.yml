version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pockethero_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - pockethero_network

  backend:
    build: .
    container_name: pockethero_backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/pockethero?authSource=admin
      PORT: 5000
      JWT_SECRET: your_jwt_secret_key_here
      NODE_ENV: development
    depends_on:
      - mongodb
    networks:
      - pockethero_network
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  pockethero_network:
    driver: bridge
